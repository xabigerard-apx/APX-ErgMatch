<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APX CardioScale</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.png" type="image/png">
  <meta name="theme-color" content="#613795">
  <style>
    @font-face {
      font-family: 'Squartiqa Inline';
      src: local('Squartiqa Inline'), local('Squartiqa4F-Inline'), local('Squartiqa');
      font-display: swap;
    }

    :root {
      --bg: #000000;
      --card-bg: #09090b;
      --card-inner: #121217;
      --border: #22222a;
      --apx-purple: #613795;
      --apx-purple-glow: rgba(97, 55, 149, 0.45);
      --text: #ffffff;
      --text-muted: #71717a;
      --male-val: #ffffff;
      --female-val: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 12px;
      min-height: 100vh;
    }

    .phone-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* TOP BAR APX */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px 4px 4px;
      border-bottom: 1px solid var(--border);
    }

    .brand-wrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .apx-logo {
      font-family: 'Squartiqa Inline', 'Arial Black', sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #fff;
      text-shadow: 0 0 10px var(--apx-purple-glow), 0 0 20px var(--apx-purple);
      line-height: 1;
    }

    .app-subtitle {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--apx-purple);
    }

    .btn-clear {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-clear:hover { 
      background: #ef4444; 
      color: #fff; 
      border-color: #ef4444; 
    }

    /* SWITCH PRINCIPAL (3 ONGLETS) */
    .mode-switch {
      display: flex;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      gap: 4px;
    }

    .mode-btn {
      flex: 1;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 9px 4px;
      font-size: 0.78rem;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      transition: all 0.2s ease;
      text-align: center;
    }

    .mode-btn.active {
      background: var(--apx-purple);
      color: #ffffff;
      border-color: #7b45bd;
      box-shadow: 0 0 12px var(--apx-purple-glow);
    }

    /* SOUS-SWITCH ERG CALC (3 OPTIONS) */
    .sub-switch {
      display: flex;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }

    .sub-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 2px;
      font-size: 0.72rem;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      text-align: center;
      transition: all 0.2s ease;
    }

    .sub-btn.active {
      background: var(--card-inner);
      color: #fff;
      border: 1px solid var(--apx-purple);
    }

    /* TOGGLE UNITE RUNNING (KM / MI) */
    .unit-toggle-row {
      display: flex;
      justify-content: center;
      margin-bottom: 2px;
    }

    .unit-toggle {
      display: flex;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px;
      gap: 2px;
    }

    .unit-toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .unit-toggle-btn.active {
      background: var(--apx-purple);
      color: #ffffff;
    }

    /* CARTES ET LIGNES */
    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 800;
      text-align: center;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .select-time {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 10px 14px;
      border-radius: 8px;
      outline: none;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .select-time:focus {
      border-color: var(--apx-purple);
      box-shadow: 0 0 12px var(--apx-purple-glow);
    }

    .item-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .item-label {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .single-box {
      width: 100%;
      max-width: 290px;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .single-box:focus-within {
      border-color: var(--apx-purple);
      box-shadow: 0 0 12px var(--apx-purple-glow);
    }

    .box-input {
      background: transparent;
      border: none;
      font-size: 1.3rem;
      font-weight: 800;
      text-align: center;
      outline: none;
      -moz-appearance: textfield;
      width: 100%;
      color: #ffffff;
    }
    .box-input::-webkit-outer-spin-button,
    .box-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .box-input::placeholder {
      color: var(--text-muted);
      opacity: 0.5;
    }

    .in-male { color: var(--male-val); }
    .in-female { color: var(--female-val); }
    .in-neutral { color: #ffffff; }

    .slash {
      color: #3f3f46;
      font-size: 1.2rem;
      font-weight: 400;
      user-select: none;
    }

    .unit-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 800;
      user-select: none;
      text-transform: lowercase;
    }

    /* BADGES DISTANCE PREDEFINIES */
    .presets-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: -2px;
      margin-bottom: 4px;
    }
    .level-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 10px;
    }
    .level-block:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .preset-pill {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .preset-pill:hover, .preset-pill.active {
      border-color: var(--apx-purple);
      color: #ffffff;
      background: rgba(97, 55, 149, 0.35);
    }
  </style>
</head>
<body>

<div class="phone-container">

  <div class="top-bar">
    <div class="brand-wrap">
      <div class="apx-logo">APX</div>
      <div class="app-subtitle">Cardio Scale</div>
    </div>
    <button class="btn-clear" onclick="resetAll()">Clear</button>
  </div>

<div class="mode-switch">
    <button class="mode-btn active" id="btnModeDist" onclick="setMode('distance')">Distance</button>
    <button class="mode-btn" id="btnModeCal" onclick="setMode('calorie')">Calories</button>
    <button class="mode-btn" id="btnModeErg" onclick="setMode('erg')">Erg Calc</button>
    <button class="mode-btn" id="btnModeWeight" onclick="setMode('weights')">Weights</button>
  </div>

  <div id="dynamicContainer"></div>

</div>

<script>
  let mainMode = 'distance';
  let ergSubMode = 'c2'; // 'c2' | 'echo' | 'run'
  let runUnit = 'km';    // 'km' | 'mi'
  let currentRunMeters = 0;
  let currentRxMlbs = 0;

  let runState = {
    distMeters: 5000,
    timeSec: 0,
    speedKmh: 0
  };

  const TABLE_DIST = [
    { label: ":15 - :30", run: 100, rowH: 125, rowF: 115, bikeH: 250, bikeF: 200, skiH: 125, skiF: 100, airH: 8, airF: 6, shut: 5 },
    { label: ":30 - 1:00", run: 200, rowH: 250, rowF: 225, bikeH: 500, bikeF: 400, skiH: 250, skiF: 200, airH: 15, airF: 12, shut: 10 },
    { label: "1:30 - 2:00", run: 400, rowH: 500, rowF: 450, bikeH: 1000, bikeF: 800, skiH: 500, skiF: 400, airH: 30, airF: 24, shut: 20 },
    { label: "2:30 - 3:00", run: 600, rowH: 750, rowF: 675, bikeH: 1500, bikeF: 1200, skiH: 750, skiF: 600, airH: 45, airF: 36, shut: 30 },
    { label: "4:00 - 5:00", run: 800, rowH: 1000, rowF: 900, bikeH: 2000, bikeF: 1600, skiH: 1000, skiF: 800, airH: 60, airF: 48, shut: 40 },
    { label: "5:00 - 6:00", run: 1000, rowH: 1250, rowF: 1125, bikeH: 2500, bikeF: 2000, skiH: 1250, skiF: 1000, airH: 75, airF: 60, shut: 50 },
    { label: "8:00 - 10:00", run: 1600, rowH: 2000, rowF: 1800, bikeH: 4000, bikeF: 3200, skiH: 2000, skiF: 1600, airH: 120, airF: 96, shut: 80 },
    { label: "10:00 - 12:30", run: 2000, rowH: 2500, rowF: 2250, bikeH: 5000, bikeF: 4000, skiH: 2500, skiF: 2000, airH: 150, airF: 120, shut: 100 },
    { label: "25:00 - 32:00", run: 5000, rowH: 6250, rowF: 5600, bikeH: 12500, bikeF: 10000, skiH: 6250, skiF: 5000, airH: 375, airF: 300, shut: 250 },
    { label: "52:00 - 68:00", run: 10000, rowH: 12500, rowF: 11250, bikeH: 25000, bikeF: 20000, skiH: 12500, skiF: 10000, airH: 750, airF: 600, shut: 500 }
  ];

  const TABLE_CAL = [
    { label: ":15 - :30", c2H: 10, c2F: 8, airH: 8, airF: 6, run: 100, shut: 5 },
    { label: ":18 - :36", c2H: 12, c2F: 10, airH: 9, airF: 7, run: 120, shut: 6 },
    { label: ":20 - :40", c2H: 13, c2F: 11, airH: 10, airF: 8, run: 135, shut: 7 },
    { label: ":22 - :45", c2H: 15, c2F: 12, airH: 11, airF: 9, run: 150, shut: 8 },
    { label: ":24 - :48", c2H: 16, c2F: 13, airH: 12, airF: 10, run: 160, shut: 9 },
    { label: ":30 - 1:00", c2H: 20, c2F: 16, airH: 15, airF: 12, run: 200, shut: 10 },
    { label: ":32 - 1:05", c2H: 21, c2F: 17, airH: 16, airF: 13, run: 215, shut: 11 },
    { label: ":36 - 1:12", c2H: 24, c2F: 19, airH: 18, airF: 14, run: 240, shut: 12 },
    { label: ":38 - 1:15", c2H: 25, c2F: 20, airH: 19, airF: 15, run: 250, shut: 13 },
    { label: ":42 - 1:22", c2H: 28, c2F: 22, airH: 21, airF: 17, run: 275, shut: 14 },
    { label: ":45 - 1:30", c2H: 30, c2F: 24, airH: 23, airF: 18, run: 300, shut: 15 },
    { label: ":50 - 1:40", c2H: 33, c2F: 26, airH: 25, airF: 20, run: 330, shut: 16 },
    { label: ":55 - 1:45", c2H: 35, c2F: 28, airH: 26, airF: 21, run: 350, shut: 17 },
    { label: "1:30 - 2:00", c2H: 40, c2F: 32, airH: 30, airF: 24, run: 400, shut: 20 },
    { label: "1:45 - 2:15", c2H: 45, c2F: 36, airH: 34, airF: 27, run: 450, shut: 23 },
    { label: "2:00 - 2:30", c2H: 50, c2F: 40, airH: 38, airF: 30, run: 500, shut: 25 },
    { label: "2:15 - 2:45", c2H: 55, c2F: 44, airH: 41, airF: 33, run: 550, shut: 27 },
    { label: "2:30 - 3:00", c2H: 60, c2F: 48, airH: 45, airF: 36, run: 600, shut: 30 },
    { label: "2:45 - 3:15", c2H: 65, c2F: 52, airH: 49, airF: 39, run: 650, shut: 33 },
    { label: "3:00 - 4:00", c2H: 70, c2F: 56, airH: 53, airF: 42, run: 700, shut: 35 },
    { label: "3:30 - 4:30", c2H: 75, c2F: 60, airH: 56, airF: 45, run: 750, shut: 37 },
    { label: "4:00 - 5:00", c2H: 80, c2F: 64, airH: 60, airF: 48, run: 800, shut: 40 },
    { label: "4:15 - 5:15", c2H: 85, c2F: 68, airH: 64, airF: 51, run: 850, shut: 43 },
    { label: "4:30 - 5:30", c2H: 90, c2F: 72, airH: 68, airF: 54, run: 900, shut: 45 },
    { label: "4:45 - 5:45", c2H: 95, c2F: 76, airH: 71, airF: 57, run: 950, shut: 47 },
    { label: "5:00 - 6:00", c2H: 100, c2F: 80, airH: 75, airF: 60, run: 1000, shut: 50 }
  ];

function setMode(mode) {
    mainMode = mode;
    document.getElementById('btnModeDist').classList.toggle('active', mode === 'distance');
    document.getElementById('btnModeCal').classList.toggle('active', mode === 'calorie');
    document.getElementById('btnModeErg').classList.toggle('active', mode === 'erg');
    document.getElementById('btnModeWeight').classList.toggle('active', mode === 'weights');
    renderLayout();
  }

  function setErgSubMode(sub) {
    ergSubMode = sub;
    renderLayout();
  }

  function setRunUnit(unit) {
    if (runUnit === unit) return;
    runUnit = unit;
    renderLayout();
  }

  function renderLayout() {
    const container = document.getElementById('dynamicContainer');

    if (mainMode === 'distance' || mainMode === 'calorie') {
      const isDist = mainMode === 'distance';
      const list = isDist ? TABLE_DIST : TABLE_CAL;

      let optionsHtml = '<option value="">-- Select Time Domain --</option>';
      list.forEach(item => {
        const selected = (currentRunMeters > 0 && item.run === currentRunMeters) ? 'selected' : '';
        optionsHtml += `<option value="${item.run}" ${selected}>${item.label}</option>`;
      });

      let fieldsHtml = '';
      if (isDist) {
        fieldsHtml = `
          <div class="section-card">
            <div class="section-title">Distance & Equivalence</div>
            <div class="item-row">
              <div class="item-label">Run</div>
              <div class="single-box">
                <input type="number" class="box-input in-neutral" id="f_run" placeholder="-" oninput="onInputRun(this.value)">
                <span class="unit-tag">m</span>
              </div>
            </div>
            <div class="item-row">
              <div class="item-label">Row</div>
              <div class="single-box">
                <input type="number" class="box-input in-male" id="f_row_m" placeholder="-" oninput="onInputRowM(this.value)">
                <span class="slash">/</span>
                <input type="number" class="box-input in-female" id="f_row_f" placeholder="-" oninput="onInputRowF(this.value)">
                <span class="unit-tag">m</span>
              </div>
            </div>
            <div class="item-row">
              <div class="item-label">BikeErg</div>
              <div class="single-box">
                <input type="number" class="box-input in-male" id="f_bike_m" placeholder="-" oninput="onInputBikeM(this.value)">
                <span class="slash">/</span>
                <input type="number" class="box-input in-female" id="f_bike_f" placeholder="-" oninput="onInputBikeF(this.value)">
                <span class="unit-tag">m</span>
              </div>
            </div>
            <div class="item-row">
              <div class="item-label">SkiErg</div>
              <div class="single-box">
                <input type="number" class="box-input in-male" id="f_ski_m" placeholder="-" oninput="onInputSkiM(this.value)">
                <span class="slash">/</span>
                <input type="number" class="box-input in-female" id="f_ski_f" placeholder="-" oninput="onInputSkiF(this.value)">
                <span class="unit-tag">m</span>
              </div>
            </div>
            <div class="item-row">
              <div class="item-label">Air Bike (Calories)</div>
              <div class="single-box">
                <input type="number" class="box-input in-male" id="f_air_m" placeholder="-" oninput="onInputAirDistM(this.value)">
                <span class="slash">/</span>
                <input type="number" class="box-input in-female" id="f_air_f" placeholder="-" oninput="onInputAirDistF(this.value)">
                <span class="unit-tag">cal</span>
              </div>
            </div>
            <div class="item-row">
              <div class="item-label">Shuttle Run (25ft + 25ft)</div>
              <div class="single-box">
                <input type="number" class="box-input in-neutral" id="f_shut" placeholder="-" oninput="onInputShut(this.value)">
                <span class="unit-tag">reps</span>
              </div>
            </div>
          </div>
        `;
      } else if (mainMode === 'erg') {
        fieldsHtml = `
          <div class="section-card">
            <div class="section-title">Calories & Equivalence</div>
            <div class="item-row">
              <div class="item-label">Row / Bike / Ski (Concept2)</div>
              <div class="single-box">
                <input type="number" class="box-input in-male" id="f_c2_m" placeholder="-" oninput="onInputC2M(this.value)">
                <span class="slash">/</span>
                <input type="number" class="box-input in-female" id="f_c2_f" placeholder="-" oninput="onInputC2F(this.value)">
                <span class="unit-tag">cal</span>
              </div>
            </div>
            <div class="item-row">
              <div class="item-label">Air Bike / Air Runner</div>
              <div class="single-box">
                <input type="number" class="box-input in-male" id="f_aircal_m" placeholder="-" oninput="onInputAirCalM(this.value)">
                <span class="slash">/</span>
                <input type="number" class="box-input in-female" id="f_aircal_f" placeholder="-" oninput="onInputAirCalF(this.value)">
                <span class="unit-tag">cal</span>
              </div>
            </div>
            <div class="item-row">
              <div class="item-label">Run (Meters)</div>
              <div class="single-box">
                <input type="number" class="box-input in-neutral" id="f_run_cal" placeholder="-" oninput="onInputRun(this.value)">
                <span class="unit-tag">m</span>
              </div>
            </div>
            <div class="item-row">
              <div class="item-label">Shuttle Run (25ft + 25ft)</div>
              <div class="single-box">
                <input type="number" class="box-input in-neutral" id="f_shut_cal" placeholder="-" oninput="onInputShut(this.value)">
                <span class="unit-tag">reps</span>
              </div>
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="section-card">
          <div class="section-title">Target Time Domain</div>
          <select class="select-time" id="sel_time" onchange="onSelectTime(this.value)">
            ${optionsHtml}
          </select>
        </div>
        ${fieldsHtml}
      `;

      if (currentRunMeters > 0) renderScale();

    } else {
      // 3E ONGLET : ERG CALC
      const isC2 = ergSubMode === 'c2';
      const isEcho = ergSubMode === 'echo';
      const isRun = ergSubMode === 'run';

      let subContent = '';
      if (isC2) {
        subContent = `
          <div class="item-row">
            <div class="item-label">Time Target (MM:SS)</div>
            <div class="single-box">
              <input type="text" inputmode="numeric" class="box-input in-neutral" id="c2_time" placeholder="-" oninput="handleMicroInput(this, () => calcC2('time'))">
            </div>
          </div>

          <div class="item-row">
            <div class="item-label">Calories Target</div>
            <div class="single-box">
              <input type="number" class="box-input in-neutral" id="c2_cal" placeholder="-" oninput="calcC2('cal')">
              <span class="unit-tag">cal</span>
            </div>
          </div>

          <div class="item-row">
            <div class="item-label">Distance Target</div>
            <div class="single-box">
              <input type="number" class="box-input in-neutral" id="c2_dist" placeholder="-" oninput="calcC2('dist')">
              <span class="unit-tag">m</span>
            </div>
          </div>

          <div class="item-row">
            <div class="item-label">Pace Target (/500m)</div>
            <div class="single-box">
              <input type="text" inputmode="numeric" class="box-input in-neutral" id="c2_pace" placeholder="-" oninput="handleMicroInput(this, () => calcC2('pace'))">
              <span class="unit-tag">/500m</span>
            </div>
          </div>

          <div class="item-row">
            <div class="item-label">Rate (Cal/hr)</div>
            <div class="single-box">
              <input type="number" class="box-input in-neutral" id="c2_calhr" placeholder="-" oninput="calcC2('calhr')">
              <span class="unit-tag">cal/hr</span>
            </div>
          </div>

          <div class="item-row">
            <div class="item-label">Power (Watts)</div>
            <div class="single-box">

  // --- SCALE LOGIC ---
  function onSelectTime(val) {

  function syncDropdown() {

    let closest = list[0].run, minDiff = Infinity;

  // --- FORMAT MICRO-ONDE FLUIDE ---
  function handleMicroInput(input, callback) {
    let raw = input.value.replace(/\D/g, '');
    if (!raw) {
      input.value = '';
      if (callback) callback();
      return;
    }
    raw = raw.slice(0, 6);
    if (raw.length <= 2) {
      input.value = `0:${raw.padStart(2, '0')}`;
    } else if (raw.length <= 4) {
      const sec = raw.slice(-2);
      const min = parseInt(raw.slice(0, -2), 10);
      input.value = `${min}:${sec}`;
    } else {
      const sec = raw.slice(-2);
      const min = raw.slice(-4, -2);
      const hr = parseInt(raw.slice(0, -4), 10);
      input.value = `${hr}:${min}:${sec}`;
    }
    if (callback) callback();
  }

  function parseFormattedSeconds(val) {
    if (!val) return 0;
    const parts = val.split(':').map(p => parseInt(p, 10) || 0);
    if (parts.length === 3) {
      return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
    } else if (parts.length === 2) {
      return (parts[0] * 60) + parts[1];
    } else if (parts.length === 1) {
      return parts[0];
    }
    return 0;
  }

  function formatDisplaySeconds(secTotal) {
    if (!secTotal || secTotal <= 0) return '';
    const rounded = Math.round(secTotal);
    const hr = Math.floor(rounded / 3600);
    const m = Math.floor((rounded % 3600) / 60);
    const s = rounded % 60;

    if (hr > 0) {
      return `${hr}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  // --- ERG CALC : CONCEPT2 ---
  function calcC2(trigger) {
    const timeEl = document.getElementById('c2_time');
    const calEl = document.getElementById('c2_cal');
    const distEl = document.getElementById('c2_dist');
    const paceEl = document.getElementById('c2_pace');
    const calHrEl = document.getElementById('c2_calhr');
    const wattsEl = document.getElementById('c2_watts');

    let tSec = parseFormattedSeconds(timeEl.value);
    let cal = parseFloat(calEl.value) || 0;
    let dist = parseFloat(distEl.value) || 0;
    let paceSec = parseFormattedSeconds(paceEl.value);
    let calHr = parseFloat(calHrEl.value) || 0;
    let watts = parseFloat(wattsEl.value) || 0;

    if (tSec > 0 && cal > 0 && (trigger === 'time' || trigger === 'cal')) {
      calHr = Math.round((cal / tSec) * 3600);
      watts = Math.max(0, (calHr - 300) / (4 * 0.8604));
      const pSec = watts > 0 ? (Math.cbrt(2.8 / watts) * 500) : 0;
      const d = pSec > 0 ? Math.round((tSec / pSec) * 500) : 0;

      distEl.value = d || '';
      paceEl.value = formatDisplaySeconds(pSec);
      calHrEl.value = calHr;
      wattsEl.value = Math.round(watts);
      return;
    }

    if (tSec > 0 && dist > 0 && (trigger === 'time' || trigger === 'dist')) {
      const pSec = (tSec / dist) * 500;
      watts = 2.8 / Math.pow(pSec / 500, 3);
      calHr = Math.round((watts * 4 * 0.8604) + 300);
      cal = Math.round((calHr * tSec) / 3600);

      calEl.value = cal;
      paceEl.value = formatDisplaySeconds(pSec);
      calHrEl.value = calHr;
      wattsEl.value = Math.round(watts);
      return;
    }

    if (paceSec > 0 && trigger === 'pace') {
      watts = 2.8 / Math.pow(paceSec / 500, 3);
      calHr = Math.round((watts * 4 * 0.8604) + 300);
      calHrEl.value = calHr;
      wattsEl.value = Math.round(watts);

      if (dist > 0) {
        tSec = (dist / 500) * paceSec;
        timeEl.value = formatDisplaySeconds(tSec);
        calEl.value = Math.round((calHr * tSec) / 3600);
      } else if (cal > 0) {
        tSec = (cal / calHr) * 3600;
        timeEl.value = formatDisplaySeconds(tSec);
        distEl.value = Math.round((tSec / paceSec) * 500);
      }
      return;
    }

    if (calHr > 0 && trigger === 'calhr') {
      watts = Math.max(0, (calHr - 300) / (4 * 0.8604));
      wattsEl.value = Math.round(watts);
      const pSec = watts > 0 ? (Math.cbrt(2.8 / watts) * 500) : 0;
      paceEl.value = formatDisplaySeconds(pSec);

      if (tSec > 0) {
        calEl.value = Math.round((calHr * tSec) / 3600);
        distEl.value = pSec > 0 ? Math.round((tSec / pSec) * 500) : '';
      } else if (cal > 0) {
        tSec = (cal / calHr) * 3600;
        timeEl.value = formatDisplaySeconds(tSec);
        distEl.value = pSec > 0 ? Math.round((tSec / pSec) * 500) : '';
      }
      return;
    }

    if (watts > 0 && trigger === 'watts') {
      calHr = Math.round((watts * 4 * 0.8604) + 300);
      calHrEl.value = calHr;
      const pSec = Math.cbrt(2.8 / watts) * 500;
      paceEl.value = formatDisplaySeconds(pSec);

      if (tSec > 0) {
        calEl.value = Math.round((calHr * tSec) / 3600);
        distEl.value = Math.round((tSec / pSec) * 500);
      } else if (cal > 0) {
        tSec = (cal / calHr) * 3600;
        timeEl.value = formatDisplaySeconds(tSec);
        distEl.value = Math.round((tSec / pSec) * 500);
      }
    }
  }

// --- ERG CALC : ECHO BIKE (CALIBRATION RÉELLE ROGUE) ---
  function wattsFromRpm(rpm) {
    if (rpm <= 0) return 0;
    if (rpm < 30) return Math.round(rpm * 1.5);
    return Math.round(0.000602337 * Math.pow(rpm, 3.11762) + 32.64);
  }

  function rpmFromWatts(watts) {
    if (watts <= 35) return 0;
    return Math.round(Math.pow((watts - 32.64) / 0.000602337, 1 / 3.11762));
  }

  function calHrFromWatts(watts) {
    return Math.round(watts * 3);
  }

  function wattsFromCalHr(calHr) {
    return Math.round(calHr / 3);
  }

 function calcEcho(trigger) {
    const timeEl = document.getElementById('echo_time');
    const calEl = document.getElementById('echo_cal');
    const rpmEl = document.getElementById('echo_rpm');
    const calHrEl = document.getElementById('echo_calhr');
    const wattsEl = document.getElementById('echo_watts');

    let tSec = parseFormattedSeconds(timeEl.value);
    let cal = parseFloat(calEl.value) || 0;
    let rpm = parseFloat(rpmEl.value) || 0;
    let calHr = parseFloat(calHrEl.value) || 0;
    let watts = parseFloat(wattsEl.value) || 0;

    // 1. Déclencheur Temps
    if (trigger === 'time') {
      if (tSec > 0 && cal > 0) {
        calHr = Math.round((cal / tSec) * 3600);
        watts = wattsFromCalHr(calHr);
        rpm = rpmFromWatts(watts);
        rpmEl.value = rpm > 0 ? rpm : '';
        calHrEl.value = calHr;
        wattsEl.value = watts;
      } else if (tSec > 0 && calHr > 0) {
        calEl.value = Math.round((calHr * tSec) / 3600);
      }
      return;
    }

    // 2. Déclencheur Calories
    if (trigger === 'cal') {
      if (tSec > 0 && cal > 0) {
        calHr = Math.round((cal / tSec) * 3600);
        watts = wattsFromCalHr(calHr);
        rpm = rpmFromWatts(watts);
        rpmEl.value = rpm > 0 ? rpm : '';
        calHrEl.value = calHr;
        wattsEl.value = watts;
      } else if (cal > 0 && calHr > 0) {
        tSec = (cal / calHr) * 3600;
        timeEl.value = formatDisplaySeconds(tSec);
      }
      return;
    }

    // 3. Déclencheur RPM
    if (trigger === 'rpm') {
      if (rpm > 0) {
        watts = wattsFromRpm(rpm);
        calHr = calHrFromWatts(watts);
        wattsEl.value = watts;
        calHrEl.value = calHr;

        if (tSec > 0) {
          calEl.value = Math.round((calHr * tSec) / 3600);
        } else if (cal > 0) {
          tSec = (cal / calHr) * 3600;
          timeEl.value = formatDisplaySeconds(tSec);
        }
      }
      return;
    }

    // 4. Déclencheur Watts
    if (trigger === 'watts') {
      if (watts > 0) {
        calHr = calHrFromWatts(watts);
        rpm = rpmFromWatts(watts);
        calHrEl.value = calHr;
        rpmEl.value = rpm > 0 ? rpm : '';

        if (tSec > 0) {
          calEl.value = Math.round((calHr * tSec) / 3600);
        } else if (cal > 0) {
          tSec = (cal / calHr) * 3600;
          timeEl.value = formatDisplaySeconds(tSec);
        }
      }
      return;
    }

    // 5. Déclencheur Cal/hr
    if (trigger === 'calhr') {
      if (calHr > 0) {
        watts = wattsFromCalHr(calHr);
        rpm = rpmFromWatts(watts);
        wattsEl.value = watts;
        rpmEl.value = rpm > 0 ? rpm : '';

        if (tSec > 0) {
          calEl.value = Math.round((calHr * tSec) / 3600);
        } else if (cal > 0) {
          tSec = (cal / calHr) * 3600;
          timeEl.value = formatDisplaySeconds(tSec);
        }
      }
    }
  }
  // --- ERG CALC : RUNNING (CONVERSION AUTOMATIQUE KM / MI) ---
  const METERS_PER_MILE = 1609.344;

  function setRunPresetMeters(m) {
    runState.distMeters = m;
    const isKm = runUnit === 'km';
    const distEl = document.getElementById('run_dist');
    if (distEl) {
      distEl.value = isKm ? Math.round(m) : parseFloat((m / METERS_PER_MILE).toFixed(2));
    }
    calcRun('dist');
  }

  function onRunCustomDist(val) {
    const num = parseFloat(val) || 0;
    runState.distMeters = (runUnit === 'km') ? num : (num * METERS_PER_MILE);
    calcRun('dist');
  }

  function updateRunDisplay() {
    const timeEl = document.getElementById('run_time');
    const paceEl = document.getElementById('run_pace');
    const speedEl = document.getElementById('run_speed');

    if (timeEl && runState.timeSec > 0) {
      timeEl.value = formatDisplaySeconds(runState.timeSec);
    }

    if (runState.speedKmh > 0) {
      const isKm = runUnit === 'km';
      const speedVal = isKm ? runState.speedKmh : (runState.speedKmh / 1.609344);
      const paceSec = isKm ? (3600 / runState.speedKmh) : (3600 / (runState.speedKmh / 1.609344));

      if (paceEl) paceEl.value = formatDisplaySeconds(paceSec);
      if (speedEl) speedEl.value = speedVal.toFixed(1);
    }
  }

  function calcRun(trigger) {
    const timeEl = document.getElementById('run_time');
    const paceEl = document.getElementById('run_pace');
    const speedEl = document.getElementById('run_speed');

    let tSec = parseFormattedSeconds(timeEl.value);
    let pSec = parseFormattedSeconds(paceEl.value);
    let speedInput = parseFloat(speedEl.value) || 0;

    const isKm = runUnit === 'km';
    const distUnitFactor = isKm ? 1000 : METERS_PER_MILE;

    if (runState.distMeters > 0 && tSec > 0 && (trigger === 'dist' || trigger === 'time')) {
      runState.timeSec = tSec;
      const secPerMeter = tSec / runState.distMeters;
      const paceVal = secPerMeter * distUnitFactor;
      runState.speedKmh = (runState.distMeters / 1000) / (tSec / 3600);
      const speedDisplay = isKm ? runState.speedKmh : (runState.speedKmh / 1.609344);

      paceEl.value = formatDisplaySeconds(paceVal);
      speedEl.value = speedDisplay.toFixed(1);
      return;
    }

    if (pSec > 0 && trigger === 'pace') {
      const secPerMeter = pSec / distUnitFactor;
      runState.speedKmh = (distUnitFactor / 1000) / (pSec / 3600);
      const speedDisplay = isKm ? runState.speedKmh : (runState.speedKmh / 1.609344);
      speedEl.value = speedDisplay.toFixed(1);

      if (runState.distMeters > 0) {
        runState.timeSec = runState.distMeters * secPerMeter;
        timeEl.value = formatDisplaySeconds(runState.timeSec);
      }
      return;
    }

    if (speedInput > 0 && trigger === 'speed') {
      runState.speedKmh = isKm ? speedInput : (speedInput * 1.609344);
      const paceVal = (distUnitFactor / 1000) / (runState.speedKmh / 3600);
      paceEl.value = formatDisplaySeconds(paceVal);

      if (runState.distMeters > 0) {
        runState.timeSec = (runState.distMeters / 1000) / (runState.speedKmh / 3600);
        timeEl.value = formatDisplaySeconds(runState.timeSec);
      }
    }
  }
// --- WEIGHTS TAB LOGIC ---
  const PRESET_BARBELL_STANDARDS = [
    { label: "45/35",   rxM: 45,  rxF: 35,  perfM: 45,  perfF: 35,  fitM: 35,  fitF: 25 },
    { label: "75/55",   rxM: 75,  rxF: 55,  perfM: 65,  perfF: 45,  fitM: 55,  fitF: 35 },
    { label: "95/65",   rxM: 95,  rxF: 65,  perfM: 75,  perfF: 55,  fitM: 65,  fitF: 45 },
    { label: "115/80",  rxM: 115, rxF: 80,  perfM: 95,  perfF: 65,  fitM: 75,  fitF: 55 },
    { label: "135/95",  rxM: 135, rxF: 95,  perfM: 115, perfF: 75,  fitM: 95,  fitF: 65 },
    { label: "155/105", rxM: 155, rxF: 105, perfM: 125, perfF: 85,  fitM: 105, fitF: 75 },
    { label: "185/125", rxM: 185, rxF: 125, perfM: 145, perfF: 95,  fitM: 125, fitF: 85 },
    { label: "205/145", rxM: 205, rxF: 145, perfM: 165, perfF: 115, fitM: 135, fitF: 95 },
    { label: "225/155", rxM: 225, rxF: 155, perfM: 185, perfF: 125, fitM: 155, fitF: 105 },
    { label: "275/185", rxM: 275, rxF: 185, perfM: 225, perfF: 155, fitM: 185, fitF: 125 },
    { label: "315/225", rxM: 315, rxF: 225, perfM: 255, perfF: 185, fitM: 205, fitF: 155 }
  ];

  const REAL_BARBELL_KG = {
    45: 20, 35: 15, 25: 10, 55: 25, 65: 30, 75: 34, 80: 36, 85: 38,
    95: 43, 105: 48, 115: 52, 125: 57, 135: 61, 145: 65, 155: 70,
    165: 75, 175: 80, 185: 84, 205: 93, 225: 102, 255: 115, 275: 125, 315: 143
  };

  const REAL_BARBELL_LBS = {
    20: 45, 15: 35, 10: 25, 25: 55, 30: 65, 34: 75, 36: 80, 38: 85,
    43: 95, 48: 105, 52: 115, 57: 125, 61: 135, 65: 145, 70: 155,
    75: 165, 80: 175, 84: 185, 93: 205, 102: 225, 115: 255, 125: 275, 143: 315
  };

  function barbellLbsToKg(lbs) {
    if (!lbs || lbs <= 0) return 0;
    if (REAL_BARBELL_KG[lbs]) return REAL_BARBELL_KG[lbs];
    return Math.round(lbs * 0.45359237);
  }

  function barbellKgToLbs(kg) {
    if (!kg || kg <= 0) return 0;
    if (REAL_BARBELL_LBS[kg]) return REAL_BARBELL_LBS[kg];
    return Math.round((kg / 0.45359237) / 5) * 5;
  }

  function roundToBarbellFive(val) {
    if (!val || val <= 0) return 0;
    return Math.max(0, Math.round(val / 5) * 5);
  }

  function renderWeightPresets() {
    const container = document.getElementById('presets_container');
    if (!container) return;
    let html = '';
    PRESET_BARBELL_STANDARDS.forEach(std => {
      const active = (currentRxMlbs > 0 && Math.abs(currentRxMlbs - std.rxM) < 2) ? 'active' : '';
      html += `<span class="preset-pill ${active}" onclick="selectWeightPreset(${std.rxM})">${std.label}</span>`;
    });
    container.innerHTML = html;
  }

  function selectWeightPreset(rxMlbs) {
    currentRxMlbs = rxMlbs;
    renderWeightPresets();
    renderWeightOutputs();
  }

  function renderWeightOutputs(skipId = null) {
    if (!currentRxMlbs || currentRxMlbs <= 0) return;

    let rxM, rxF, perfM, perfF, fitM, fitF;
    const exact = PRESET_BARBELL_STANDARDS.find(s => Math.abs(s.rxM - currentRxMlbs) < 1);

    if (exact) {
      rxM = exact.rxM; rxF = exact.rxF;
      perfM = exact.perfM; perfF = exact.perfF;
      fitM = exact.fitM; fitF = exact.fitF;
    } else {
      rxM = currentRxMlbs;
      rxF = (currentRxMlbs === 45) ? 35 : roundToBarbellFive(currentRxMlbs * 0.70);
      perfM = roundToBarbellFive(currentRxMlbs * 0.80);
      perfF = (rxF === 35) ? 35 : roundToBarbellFive(rxF * 0.80);
      fitM = roundToBarbellFive(currentRxMlbs * 0.65);
      fitF = (rxF === 35) ? 25 : roundToBarbellFive(rxF * 0.65);
    }

    updateField('rx_m_lbs', rxM, skipId);
    updateField('rx_f_lbs', rxF, skipId);
    updateField('perf_m_lbs', perfM, skipId);
    updateField('perf_f_lbs', perfF, skipId);
    updateField('fit_m_lbs', fitM, skipId);
    updateField('fit_f_lbs', fitF, skipId);

    updateField('rx_m_kg', barbellLbsToKg(rxM), skipId);
    updateField('rx_f_kg', barbellLbsToKg(rxF), skipId);
    updateField('perf_m_kg', barbellLbsToKg(perfM), skipId);
    updateField('perf_f_kg', barbellLbsToKg(perfF), skipId);
    updateField('fit_m_kg', barbellLbsToKg(fitM), skipId);
    updateField('fit_f_kg', barbellLbsToKg(fitF), skipId);
  }

  function onWeightInput(sourceId, rawVal) {
    const val = parseFloat(rawVal) || 0;
    if (val <= 0) {
      currentRxMlbs = 0;
      renderWeightPresets();
      return;
    }

    let lbsVal = sourceId.endsWith('_kg') ? barbellKgToLbs(val) : val;

    switch (sourceId) {
      case 'rx_m_lbs':
      case 'rx_m_kg':
        currentRxMlbs = lbsVal;
        break;
      case 'rx_f_lbs':
      case 'rx_f_kg':
        currentRxMlbs = (lbsVal === 35) ? 45 : roundToBarbellFive(lbsVal / 0.70);
        break;
      case 'perf_m_lbs':
      case 'perf_m_kg':
        currentRxMlbs = roundToBarbellFive(lbsVal / 0.80);
        break;
      case 'perf_f_lbs':
      case 'perf_f_kg':
        currentRxMlbs = (lbsVal === 35) ? 45 : roundToBarbellFive((lbsVal / 0.80) / 0.70);
        break;
      case 'fit_m_lbs':
      case 'fit_m_kg':
        currentRxMlbs = roundToBarbellFive(lbsVal / 0.65);
        break;
      case 'fit_f_lbs':
      case 'fit_f_kg':
        currentRxMlbs = (lbsVal === 25) ? 45 : roundToBarbellFive((lbsVal / 0.65) / 0.70);
        break;
    }

    renderWeightPresets();
    renderWeightOutputs(sourceId);
  }

  
function resetAll() {
    currentRunMeters = 0;
    currentRxMlbs = 0;
    runState = { distMeters: 5000, timeSec: 0, speedKmh: 0 };
    renderLayout();
  }

  // Enregistrement PWA Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  window.onload = () => renderLayout();
</script>
</body>
